<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#F6F3EE">
  <!-- include: noindex if noindex -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Woobee">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- include: canonical if siteUrl -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Woobee">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ogImageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v={{cssVersion}}">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>

  <!-- include: sprite -->

  <a class="skip" href="#main">Skip to content</a>

  <!-- Navigation: 72px solid bone bar, never transparent over photography -->
  <!-- include: header -->

  <main id="main">

{{content}}

  </main>

  <!-- include: footer -->

  <!-- include: film if film -->

  <script src="main.js?v={{jsVersion}}" defer></script>
</body>
</html>
