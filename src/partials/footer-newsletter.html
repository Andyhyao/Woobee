<form class="newsletter" novalidate aria-labelledby="newsletter-title">
  <h2 class="newsletter__title" id="newsletter-title">Join the journey</h2>
  <p class="newsletter__text">New arrivals, trail notes and early access to drops.</p>
  <label class="newsletter__label" for="newsletter-email">Email address</label>
  <div class="newsletter__row">
    <input class="newsletter__input" id="newsletter-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-describedby="newsletter-msg" required>
    <button class="btn btn--bone" type="submit">Subscribe</button>
  </div>
  <p class="newsletter__msg" id="newsletter-msg" aria-live="polite"></p>
</form>
